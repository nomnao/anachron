<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANACHRON</title>
  <link rel="stylesheet" href="css/system.css">
  <link rel="stylesheet" href="css/os.css">

  <!-- Google Analytics. It only loads on the real site, so testing
       on your own computer (localhost) isn't counted. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
      const ga = document.createElement('script');
      ga.async = true;
      ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-RVVY068NWJ';
      document.head.append(ga);
      gtag('js', new Date());
      gtag('config', 'G-RVVY068NWJ');
    }
  </script>
</head>
<body>
  <p id="device-note">ANACHRON works best on a computer.</p>

  <div id="workstation">

    <div id="monitor">
      <div id="bezel">
        <div id="crt-screen"></div>
        <div id="glass"></div>
      </div>
      <div id="monitor-chin">
        <div class="knob"></div>
        <div class="knob"></div>
        <div id="chin-spacer"></div>
        <div id="power-led"></div>
        <button id="power-button" aria-label="Power"></button>
      </div>
    </div>

    <div id="monitor-neck"></div>
    <div id="monitor-base"></div>
    <div id="floor-shadow"></div>
  </div>

  <script type="module" src="js/main.js"></script>

  <!-- Visit counting with GoatCounter: no cookies, no personal data -->
  <script data-goatcounter="https://nomnao.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>

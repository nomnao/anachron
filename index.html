<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANACHRON</title>
  <link rel="stylesheet" href="css/system.css">
</head>
<body>
  <div id="workstation">

    <div id="monitor">
      <div id="bezel">
        <div id="crt-screen"></div>
        <div id="glass"></div>
      </div>
      <div id="monitor-chin">
        <div class="knob"></div>
        <div class="knob"></div>
        <div id="chin-spacer"></div>
        <div id="power-led"></div>
        <button id="power-button" aria-label="Power"></button>
      </div>
    </div>

    <div id="monitor-neck"></div>
    <div id="monitor-base"></div>

    <div id="computer">
      <div id="case-seam"></div>
      <div id="case-badge"></div>
      <div id="case-vents">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div id="drive-bays">
        <div class="drive floppy">
          <span class="slot"></span>
          <span class="drive-led"></span>
          <span class="eject"></span>
        </div>
        <div class="drive blank"></div>
      </div>
      <div id="case-power">
        <span class="case-led green"></span>
        <span class="case-led amber"></span>
      </div>
    </div>

    <div id="floor-shadow"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

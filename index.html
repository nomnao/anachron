<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANACHRON</title>
  <link rel="stylesheet" href="css/system.css">
</head>
<body>
  <div id="workstation">

    <div id="monitor">
      <div id="bezel">
        <div id="crt-screen"></div>
      </div>
      <div id="monitor-chin">
        <div id="power-led"></div>
        <button id="power-button" aria-label="Power"></button>
      </div>
    </div>

    <div id="monitor-neck"></div>
    <div id="monitor-base"></div>

    <div id="computer">
      <div id="case-badge"></div>
      <div id="case-vents"></div>
      <div id="drive-bays">
        <div class="drive floppy"><span class="slot"></span></div>
        <div class="drive cdrom"></div>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
